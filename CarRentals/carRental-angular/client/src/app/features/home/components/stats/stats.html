<section class="stats-section">
  <div class="container stats-grid">
    @for (stat of stats; track stat.label) {
      <div class="stat-card">
        <i [class]="stat.icon"></i>
        <h3><span [appCountUp]="stat.value" [suffix]="stat.suffix">0</span></h3>
        <p>{{ stat.label }}</p>
      </div>
    }
  </div>
</section>
