<form class="transaction-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="transaction-form__type">
    <label class="type-option" [class.active]="form.value.type === 'expense'">
      <input type="radio" formControlName="type" value="expense" />
      <i class="fa-solid fa-arrow-trend-down"></i> Expense
    </label>
    <label class="type-option" [class.active]="form.value.type === 'income'">
      <input type="radio" formControlName="type" value="income" />
      <i class="fa-solid fa-arrow-trend-up"></i> Income
    </label>
  </div>

  <div class="transaction-form__row">
    <div class="field">
      <input
        type="text"
        formControlName="description"
        placeholder="Description"
        class="form-input"
        [class.invalid]="descriptionInvalid"
      />
      @if (descriptionInvalid) { <p class="error">Description is required.</p> }
    </div>

    <div class="field">
      <input
        type="number"
        formControlName="amount"
        placeholder="Amount"
        step="0.01"
        min="0"
        class="form-input"
        [class.invalid]="amountInvalid"
      />
      @if (amountInvalid) { <p class="error">Enter an amount greater than 0.</p> }
    </div>

    <select formControlName="category" class="form-select">
      @for (cat of categoryOptions(); track cat) {
        <option [value]="cat"><i [class]="categoryIcons[cat]"></i> {{ cat }}</option>
      }
    </select>

    <button type="submit" class="submit-btn" [class.income]="form.value.type === 'income'">
      <i class="fa-solid fa-plus"></i> Add {{ form.value.type === 'income' ? 'Income' : 'Expense' }}
    </button>
  </div>
</form>
