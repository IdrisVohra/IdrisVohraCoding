<div class="task-list">
  @if (store.filteredTasks().length > 0) {
    <div class="task-list__header">
      <label class="select-all">
        <input type="checkbox" [checked]="allSelected" (change)="selectAll()" />
        Select All
      </label>
      <span>{{ store.filteredTasks().length }} task{{ store.filteredTasks().length === 1 ? '' : 's' }} found</span>
    </div>

    <div class="task-list__items">
      @for (task of store.filteredTasks(); track task.id) {
        <app-task-item [task]="task" />
      }
    </div>
  } @else {
    <div class="task-list__empty">
      <i class="fa-solid fa-clipboard-list"></i>
      <p>No tasks found. Add some tasks to get started!</p>
    </div>
  }
</div>
